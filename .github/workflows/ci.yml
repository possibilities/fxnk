name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate repository contracts
        run: tests/validate.sh
      - name: Check shell scripts
        run: |
          shellcheck --severity=warning scripts/*.sh tests/validate.sh \
            tests/install-transaction.sh \
            tests/local-gate/receipt-transaction.sh \
            tests/ci-watch/verdict-transaction.sh \
            tests/ci-watch/fixtures/*.sh
